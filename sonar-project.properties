sonar.projectKey=magrhino_WUD-Updater
sonar.organization=magrhino

# Exclude test harnesses while keeping source modules covered by CPD.
sonar.cpd.exclusions=tests/**/*,webui/tests/**/*

# Image references pin both a readable tag and an immutable digest on purpose;
# Renovate keeps the pair in sync, so S8431 ("tag or digest, not both") does not apply.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
