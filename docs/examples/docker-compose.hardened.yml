# This example is a more secure version of the docker-compose.webui.yml
# example that uses a socket proxy to give the WUDup container access
# to a limited subset of the Docker API instead of mounting the raw Docker
# socket. This minimizes the attack surface and potential damage if the
# WUDup container is compromised, while still allowing it to manage
# WUD helper containers and perform updates. Please see the documentation
# and comments in this file for more details on the security features and
# best practices when running WUDup.
services:
  socket-proxy-wudup:
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    networks:
      - wudup-socket
    environment:
      # This is the only service with the raw host socket. WUD and
      # WUDup talk to this internal proxy instead of mounting
      # /var/run/docker.sock directly.
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      # Required for docker compose pull/stop/up and image pulls. The WebUI
      # keeps browser mutations disabled unless WUD_WEB_MUTATIONS_ENABLED=true.
      POST: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  wud:
    image: getwud/wud:latest
    restart: unless-stopped
    networks:
      - wudup-app
      - wudup-egress
      - wudup-socket
    depends_on:
      - socket-proxy-wudup
    environment:
      # WUD 9 requires an administrator, including on private Docker networks.
      # Set a strong password in a private Compose env file before first start.
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER:-admin}"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:-}"
      # WUD watches Docker through the proxy. Legacy mode writes pending
      # updates to /out/images.todo through mounted callback scripts.
      WUD_WATCHER_LOCAL_HOST: socket-proxy-wudup
      WUD_WATCHER_LOCAL_PORT: "2375"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "true"
      WUD_REGISTRY_HUB_PUBLIC_WATCHDIGEST: "true"
      # WebUI release-note notifications poll WUD's API directly.
    volumes:
      - wud-scripts:/wud:ro
      - wud-out:/out
      - wud-store:/store
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  wudup:
    image: ${WUDUP_IMAGE:-ghcr.io/magrhino/wudup:latest}
    restart: unless-stopped
    networks:
      - wudup-app
      - wudup-egress
      - wudup-socket
    depends_on:
      socket-proxy-wudup:
        condition: service_started
      wud:
        condition: service_healthy
    environment:
      # The Docker CLI and Compose plugin use the same constrained proxy.
      DOCKER_HOST: tcp://socket-proxy-wudup:2375
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: "${WUD_OUT_FILE:-/out/images.todo}"
      WUD_TIMEZONE: "${WUD_TIMEZONE:-UTC}"
      WUD_WEB_PORT: "${WUD_WEB_PORT:-7417}"
      WUD_WEB_MUTATIONS_ENABLED: "${WUD_WEB_MUTATIONS_ENABLED:-false}"
      WUD_WEB_PUBLIC_ORIGIN: "${WUD_WEB_PUBLIC_ORIGIN:-}"
      WUD_WEB_ALLOWED_HOSTS: "${WUD_WEB_ALLOWED_HOSTS:-}"
      WUD_WEB_TRUSTED_PROXIES: "${WUD_WEB_TRUSTED_PROXIES:-}"
      WUD_WEB_SECURE_COOKIES: "${WUD_WEB_SECURE_COOKIES:-auto}"
      # WUD 9 also requires outbound API credentials; bootstrap credentials
      # above are not inherited here. See wiki/webui-container.md#wud-api-authentication.
      WUD_API_BASE_URL: "${WUD_API_BASE_URL:-http://wud:3000}"
      WUD_API_STARTUP_WAIT_SECONDS: "${WUD_API_STARTUP_WAIT_SECONDS:-5}"
      WUD_API_AUTH_BEARER_TOKEN: "${WUD_API_AUTH_BEARER_TOKEN:-}"
      WUD_API_AUTH_BEARER_TOKEN_FILE: "${WUD_API_AUTH_BEARER_TOKEN_FILE:-}"
      WUD_API_AUTH_BASIC_USER: "${WUD_API_AUTH_BASIC_USER:-}"
      WUD_API_AUTH_BASIC_PASSWORD: "${WUD_API_AUTH_BASIC_PASSWORD:-}"
      WUD_API_AUTH_BASIC_PASSWORD_FILE: "${WUD_API_AUTH_BASIC_PASSWORD_FILE:-}"
      WUD_API_HEADERS_FILE: "${WUD_API_HEADERS_FILE:-}"
      WUD_PENDING_SOURCE: "${WUD_PENDING_SOURCE:-api}"
      WUDUP_LEGACY_SCRIPTS: "${WUDUP_LEGACY_SCRIPTS:-true}"
      # Leave unset to manage from Settings; uncomment to force the env override.
      # WUD_RELEASE_NOTES_ENABLED: "true"
      # Use WUDUP_IMAGE=ghcr.io/magrhino/wudup:latest-trivy when enabling scans.
      WUD_SECURITY_SCANNING_ENABLED: "${WUD_SECURITY_SCANNING_ENABLED:-false}"
      # Optional advanced override when trivy is installed at a non-standard path.
      # WUD_SECURITY_SCANNER_EXECUTABLE: "${WUD_SECURITY_SCANNER_EXECUTABLE:-trivy}"
      WUD_SECURITY_SCAN_CACHE_DIR: "${WUD_SECURITY_SCAN_CACHE_DIR:-/logs/trivy-cache}"
      WUD_SECURITY_SCAN_TIMEOUT_SECONDS: "${WUD_SECURITY_SCAN_TIMEOUT_SECONDS:-300}"
      HOME: /tmp
      OUT_UID: "${OUT_UID:-1000}"
      OUT_GID: "${OUT_GID:-1000}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      DISCORD_WEBHOOK: "${DISCORD_WEBHOOK:-}"
    ports:
      - "${WEBUI_HTTP_BIND:-127.0.0.1}:${WUD_WEB_PORT:-7417}:${WUD_WEB_PORT:-7417}"
    volumes:
      # Keep this path aligned with DOCKER_BASE. It is writable because the
      # updater may rewrite Compose image tags when --allow-tag-updates is used.
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      # WebUI logs and SQLite state are kept outside the Docker stack root.
      - ${WEBUI_LOG_DIR:-./logs}:/logs
      # Startup sync copies this repo's WUD callback scripts here for WUD.
      - wud-scripts:/managed-wud
      - wud-out:/out
      # For basic API auth, mount a password-only file (example host path):
      # - /srv/wudup/secrets/wud_api_password:/run/secrets/wud_api_password:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # The WebUI runs without sudo, but still needs to write logs, preserve
      # todo-file ownership, and optionally rewrite bind-mounted Compose files.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

networks:
  wudup-app:
    internal: true
  wudup-egress:
  wudup-socket:
    internal: true

volumes:
  wud-scripts:
  wud-out:
  wud-store:
