# This is only if you want to build the WUDup image yourself. You can also just use the pre-built image from GHCR, which is what the docker-compose.hardened.yml example does.
services:
  wud:
    image: getwud/wud:latest
    environment:
      # WUD 9 requires an administrator, including on private Docker networks.
      # WUD reads its password from the wud_api_password secret below.
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER:-admin}"
      WUD_AUTH_ADMIN_PASSWORD__FILE: /run/secrets/wud_api_password
      WUD_REGISTRY_HUB_PUBLIC_WATCHDIGEST: "true"
    secrets:
      - wud_api_password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-store:/store

  wudup:
    build: ../..
    image: magrhino/wudup:local
    # WUDup reads its settings from the .env file next to this Compose file,
    # or from the file WUDUP_ENV_FILE names. See docs/CONFIGURATION.md for
    # every variable. WUD never receives this file, and the values below win
    # over it.
    env_file:
      - path: ${WUDUP_ENV_FILE:-.env}
        required: false
    environment:
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      HOST_DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      OUT_UID: "1000"
      OUT_GID: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      - ./logs:/logs
      # docker-update-from-wud reads /out/images.todo, which you maintain; WUDup
      # no longer ships a WUD callback that writes it. Use docker-compose.webui.yml
      # for the WebUI, which reads pending updates from the WUD API.
      - wud-out:/out
    # Checks Docker access, paths, and Compose discovery without changing anything.
    # Preview queued updates with: docker compose run --rm wudup docker-update-from-wud --dry-run
    command: [ "doctor" ]

secrets:
  # A file holding only WUD's administrator password, created before first
  # start. Keep it mode 0644 inside a mode 0700 directory. See
  # wiki/webui-container.md#wud-api-authentication.
  wud_api_password:
    file: ${WUDUP_SECRETS_DIR:-./secrets}/wud_api_password

volumes:
  wud-out:
  wud-store:
