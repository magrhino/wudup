# You most likely want to run docker-compose.hardened.yml instead of this one, which has more secure defaults.
services:
  wud:
    image: getwud/wud:latest
    environment:
      # WUD 9 requires an administrator, including on private Docker networks.
      # Set a strong password in a private Compose env file before first start.
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER:-admin}"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:-}"
      WUD_REGISTRY_HUB_PUBLIC_WATCHDIGEST: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-store:/store

  wudup:
    image: ghcr.io/magrhino/wudup:latest
    environment:
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      OUT_UID: "1000"
      OUT_GID: "1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      - ./logs:/logs
      # docker-update-from-wud reads /out/images.todo, which you maintain; WUDup
      # no longer ships a WUD callback that writes it. Use docker-compose.webui.yml
      # for the WebUI, which reads pending updates from the WUD API.
      - wud-out:/out
    # Checks Docker access, paths, and Compose discovery without changing anything.
    # Preview queued updates with: docker compose run --rm wudup docker-update-from-wud --dry-run
    command: [ "doctor" ]

volumes:
  wud-out:
  wud-store:
