# EXPERIMENTAL: this example has not been verified by the project maintainer on
# TrueNAS SCALE. Validate it in a non-critical environment
# and share results before relying on it in production.
#
# This example runs WUDup on TrueNAS SCALE using the built-in Docker support.
# It is not hardened by default, but you
# can use the docker-compose.hardened.yml example as a starting point to add
# more secure defaults if you want.
# Please open an issue if you experience any problems running this on TrueNAS
# SCALE, or if you have suggestions for improving the TrueNAS experience.
# Note that the WUDup container needs access to the Docker socket and a
# compatible API client to manage containers on TrueNAS SCALE, which is why it
# is not hardened by default.
# Community testing and maintenance help is welcome.
services:
  wud:
    image: getwud/wud:latest
    environment:
      # WUD 9 requires an administrator, including on private Docker networks.
      # Set a strong password in a private Compose env file before first start.
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER:-admin}"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD:-}"
      WUD_REGISTRY_HUB_PUBLIC_WATCHDIGEST: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-scripts:/wud:ro
      - wud-out:/out
      - wud-store:/store
    # File-mode fallback: configure your WUD trigger to call:
    #   /wud/append-updates.sh
    # Use /wud/on-update.sh only for legacy shell release-note notifications.

  wudup:
    build:
      context: ../..
      args:
        # Pick a client tag compatible with your TrueNAS release. See:
        #   https://github.com/truenas/api_client#version-compatibility--features
        TRUENAS_API_CLIENT_REF: ${TRUENAS_API_CLIENT_REF:-TS-26.0.0-BETA.1}
    image: magrhino/wudup:truenas-status
    environment:
      DOCKER_BASE: ${HOST_DOCKER_BASE:-/srv/docker}
      WUD_OUT_FILE: /out/images.todo
      WUD_LOG_DIR: /logs
      # TrueNAS helper support is implemented in the Python/container wrapper.
      WUDUP_USE_SUDO: "false"
      OUT_UID: "1000"
      OUT_GID: "1000"
      # Uses Docker to start a short-lived helper container that mounts the
      # local TrueNAS middleware socket and returns minimized status JSON.
      TRUENAS_STATUS_CHECK: "true"
      TRUENAS_STATUS_TIMEOUT: "5"
    volumes:
      # WARNING: the Docker socket gives root-equivalent control over the host.
      # Prefer the hardened socket-proxy example when you do not need this raw
      # socket in the helper container.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DOCKER_BASE:-/srv/docker}:${HOST_DOCKER_BASE:-/srv/docker}
      - ./logs:/logs
      - wud-scripts:/managed-wud
      - wud-out:/out
    command: [ "updates", "--dry-run" ]

volumes:
  wud-scripts:
  wud-out:
  wud-store:
