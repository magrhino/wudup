name: release-please

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        ) ||
        (
          github.event_name == 'push' &&
          !(
            startsWith(github.event.head_commit.message, 'docs:') ||
            startsWith(github.event.head_commit.message, 'docs(') ||
            startsWith(github.event.head_commit.message, 'docs!:') ||
            (
              (
                startsWith(github.event.head_commit.message, 'chore:') ||
                startsWith(github.event.head_commit.message, 'chore(') ||
                startsWith(github.event.head_commit.message, 'chore!:')
              ) &&
              !startsWith(github.event.head_commit.message, 'chore: release ')
            )
          )
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5 / v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Resolve release publisher tag
        id: release-publisher
        if: >-
          ${{
            steps.release.outputs.release_created == 'true' ||
            steps.release.outputs.releases_created == 'true' ||
            (
              github.event_name == 'pull_request_target' &&
              github.event.pull_request.merged == true &&
              contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
            )
          }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$EVENT_NAME" == "pull_request_target" ]]; then
            if [[ "$PR_TITLE" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \[skip\ ci\])?$ ]]; then
              tag="v${BASH_REMATCH[1]}"
            else
              printf 'Could not derive release tag from Release Please PR title: %s\n' "$PR_TITLE" >&2
              exit 1
            fi
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must match vX.Y.Z, got: %s\n' "$tag" >&2
            exit 1
          fi

          if ! release_is_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"; then
            printf 'Release Please did not create release %s; refusing to dispatch publisher.\n' "$tag" >&2
            exit 1
          fi

          printf 'Resolved release publisher tag %s (draft=%s)\n' "$tag" "$release_is_draft"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch release publisher
        if: ${{ steps.release-publisher.outputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release-publisher.outputs.tag }}
        run: |
          set -euo pipefail

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG"
