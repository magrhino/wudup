name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish, formatted as vX.Y.Z.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: magrhino/wudup
  BUILDX_CACHE_FROM: type=gha,scope=wudup-release
  BUILDX_CACHE_TO: type=gha,scope=wudup-release,mode=max

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      minor: ${{ steps.tag.outputs.minor }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must match vX.Y.Z, got: %s\n' "$tag" >&2
            exit 1
          fi

          version="${tag#v}"
          minor="${version%.*}"
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'minor=%s\n' "$minor"
          } >> "$GITHUB_OUTPUT"

  release-python:
    name: release python
    needs:
      - validate-tag
    uses: ./.github/workflows/release-validation.yml
    with:
      release_tag: ${{ needs.validate-tag.outputs.tag }}
      suite: python
      timeout_minutes: 45

  release-shell:
    name: release shell
    needs:
      - validate-tag
    uses: ./.github/workflows/release-validation.yml
    with:
      release_tag: ${{ needs.validate-tag.outputs.tag }}
      suite: shell
      timeout_minutes: 10

  release-webui:
    name: release webui
    needs:
      - validate-tag
    uses: ./.github/workflows/release-validation.yml
    with:
      release_tag: ${{ needs.validate-tag.outputs.tag }}
      suite: webui
      timeout_minutes: 45

  release-webui-smoke:
    name: release webui smoke
    needs:
      - validate-tag
    uses: ./.github/workflows/release-validation.yml
    with:
      release_tag: ${{ needs.validate-tag.outputs.tag }}
      suite: webui-smoke
      timeout_minutes: 30

  release-docker:
    name: release docker
    needs:
      - validate-tag
    uses: ./.github/workflows/release-validation.yml
    with:
      release_tag: ${{ needs.validate-tag.outputs.tag }}
      suite: docker
      timeout_minutes: 60

  release-validations:
    name: release validations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - release-python
      - release-shell
      - release-webui
      - release-webui-smoke
      - release-docker
    if: ${{ always() }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check release validation results
        shell: bash
        env:
          RELEASE_PYTHON_RESULT: ${{ needs.release-python.result }}
          RELEASE_SHELL_RESULT: ${{ needs.release-shell.result }}
          RELEASE_WEBUI_RESULT: ${{ needs.release-webui.result }}
          RELEASE_WEBUI_SMOKE_RESULT: ${{ needs.release-webui-smoke.result }}
          RELEASE_DOCKER_RESULT: ${{ needs.release-docker.result }}
        run: |
          set -euo pipefail

          failed=0
          check_result() {
            name="$1"
            result="$2"
            if [[ "$result" == "success" ]]; then
              printf '%s succeeded\n' "$name"
              return
            fi

            printf '%s finished with %s\n' "$name" "$result" >&2
            failed=1
          }

          check_result release-python "$RELEASE_PYTHON_RESULT"
          check_result release-shell "$RELEASE_SHELL_RESULT"
          check_result release-webui "$RELEASE_WEBUI_RESULT"
          check_result release-webui-smoke "$RELEASE_WEBUI_SMOKE_RESULT"
          check_result release-docker "$RELEASE_DOCKER_RESULT"

          exit "$failed"

  publish-image:
    name: publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    needs:
      - validate-tag
      - release-validations

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve release commit
        id: release-commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
          APT_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          bash .github/scripts/publish-release-image.sh default

      - name: Create or publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --verify-tag
              printf 'Published draft release for %s\n' "$RELEASE_TAG"
            else
              printf 'Release already exists for %s\n' "$RELEASE_TAG"
            fi
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"

  publish-trivy-image:
    name: publish trivy image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs:
      - validate-tag
      - release-validations

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve release commit
        id: release-commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Trivy image
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          MINOR_VERSION: ${{ needs.validate-tag.outputs.minor }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
          APT_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          bash .github/scripts/publish-release-image.sh trivy
