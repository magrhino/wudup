name: dependency auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Dependency PR to recheck after checks or review complete.
        required: true
        type: number
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - dependency auto-merge candidate
      - ci
      - security
      - CodeQL Advanced
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.ref }}
  cancel-in-progress: false

jobs:
  merge-candidate:
    name: merge eligible dependency PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.event == 'pull_request' ||
            github.event.workflow_run.event == 'pull_request_target'
          ) &&
          github.event.workflow_run.pull_requests[0].number != null
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Merge the verified candidate when required checks pass
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          if ! jq -e \
            --arg repository "$GH_REPO" \
            '.state == "open" and
             .draft == false and
             .base.ref == "main" and
             .head.repo.full_name == $repository and
             (.user.login == "dependabot[bot]" or .user.login == "renovate[bot]")' \
            >/dev/null <<<"$pr_json"; then
            exit 0
          fi

          bot="$(jq -r '.user.login' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          candidate_name="dependency-candidate-$PR_NUMBER-$head_sha"
          candidate_run_id="$(
            gh api "repos/$GH_REPO/actions/artifacts?name=$candidate_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty'
          )"
          if [[ -z "$candidate_run_id" ]]; then
            exit 0
          fi

          candidate_workflow_id="$(
            gh api "repos/$GH_REPO/actions/workflows/dependency-automerge-candidate.yml" --jq '.id'
          )"
          candidate_run_json="$(gh api "repos/$GH_REPO/actions/runs/$candidate_run_id")"
          if ! jq -e \
            --argjson workflow_id "$candidate_workflow_id" \
            '.workflow_id == $workflow_id and
             .name == "dependency auto-merge candidate" and
             .event == "pull_request_target" and
             .conclusion == "success"' \
            >/dev/null <<<"$candidate_run_json"; then
            exit 0
          fi

          candidate_dir="$RUNNER_TEMP/$candidate_name"
          mkdir -p "$candidate_dir"
          gh run download "$candidate_run_id" \
            --repo "$GH_REPO" \
            --name "$candidate_name" \
            --dir "$candidate_dir"
          if ! jq -e \
            --arg repository "$GH_REPO" \
            --arg bot "$bot" \
            --arg head_sha "$head_sha" \
            --argjson pr_number "$PR_NUMBER" \
            '.schema == 1 and
             .eligible == true and
             .repository == $repository and
             .bot == $bot and
             .head_sha == $head_sha and
             .pr_number == $pr_number' \
            "$candidate_dir/candidate.json" >/dev/null; then
            exit 0
          fi

          # External checks can finish after the final workflow_run event.
          if ! gh pr checks "$PR_NUMBER" --repo "$GH_REPO" --required --watch --fail-fast --interval 10; then
            exit 0
          fi

          commits_json="$(
            gh api --paginate --slurp \
              "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100"
          )"
          if ! jq -e \
            --arg bot "$bot" \
            '[.[][]] |
             length == 1 and
             all(.[];
               .author.login == $bot and
               .committer.login == "web-flow" and
               .commit.verification.verified == true and
               .commit.verification.reason == "valid"
             )' >/dev/null <<<"$commits_json"; then
            exit 0
          fi

          if [[ "$bot" == 'renovate[bot]' ]]; then
            events_json="$(
              gh api --paginate --slurp \
                "repos/$GH_REPO/issues/$PR_NUMBER/events?per_page=100"
            )"
            if ! jq -e \
              'any(.labels[]; .name == "automerge")' \
              >/dev/null <<<"$pr_json"; then
              exit 0
            fi
            if [[ "$(
              jq -r \
                '[.[][] |
                  select(
                    (.event == "labeled" or .event == "unlabeled") and
                    .label.name == "automerge"
                  )] |
                 sort_by(.created_at, .id) |
                 last |
                 select(.event == "labeled") |
                 .actor.login // empty' <<<"$events_json"
            )" != 'renovate[bot]' ]]; then
              exit 0
            fi
          fi

          # Require each complete workflow, not just branch-required jobs.
          # Query the latest run for this head, never a previous successful run.
          for workflow in ci.yml security.yml codeql.yml; do
            run_json="$(
              gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?event=pull_request&head_sha=$head_sha&per_page=1"
            )"
            if ! jq -e \
              --arg sha "$head_sha" \
              --argjson pr "$PR_NUMBER" '
                .workflow_runs[0] |
                .head_sha == $sha and .event == "pull_request" and
                .status == "completed" and .conclusion == "success" and
                any(.pull_requests[]; .number == $pr)
              ' >/dev/null <<<"$run_json"; then
              printf 'Waiting for a successful %s run on the current PR commit.\n' "$workflow"
              exit 0
            fi

            case "$workflow" in
              ci.yml) required_jobs='["python tests", "shell tests", "webui checks"]' ;;
              security.yml) required_jobs='["dependency review", "workflow security"]' ;;
              codeql.yml) required_jobs='["Analyze (actions)", "Analyze (python)", "Analyze (javascript-typescript)"]' ;;
            esac
            run_id="$(jq -r '.workflow_runs[0].id' <<<"$run_json")"
            # Keep successful jobs from earlier attempts when only failed jobs
            # were rerun, but never accept an older result for a retried job.
            jobs_json="$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all&per_page=100")"
            if ! jq -e --argjson required "$required_jobs" '
              ([.[] | .jobs[]] | group_by(.name) | map(max_by(.id))) as $jobs |
              all($required[]; . as $name |
                any($jobs[]; .name == $name and .status == "completed" and .conclusion == "success"))
            ' >/dev/null <<<"$jobs_json"; then
              printf 'Required jobs in %s must succeed; missing or skipped jobs do not qualify.\n' "$workflow"
              exit 0
            fi
          done

          # Respect branch protection even if the merge token has admin bypass.
          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$head_sha" --arg repository "$GH_REPO" '
            .state == "open" and .draft == false and
            .base.ref == "main" and .head.repo.full_name == $repository and
            .head.sha == $sha and .mergeable_state == "clean" and
            (.user.login != "renovate[bot]" or any(.labels[]; .name == "automerge"))
          ' >/dev/null <<<"$pr_json"; then
            printf 'PR changed or is not cleanly mergeable; leaving it open.\n'
            exit 0
          fi

          merge_json="$(
            GH_TOKEN="$MERGE_TOKEN" gh api --method PUT \
              "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash \
              -f sha="$head_sha"
          )"
          jq -e '.merged == true' >/dev/null <<<"$merge_json"

  rebase-dependabot:
    name: rebase Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Rebase outdated Dependabot PRs
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list \
            --author 'dependabot[bot]' \
            --base main \
            --json mergeStateStatus,number \
            --jq '.[] | select(.mergeStateStatus == "BEHIND") | .number' |
          while read -r pr_number; do
            gh pr comment "$pr_number" --body '@dependabot rebase'
          done
