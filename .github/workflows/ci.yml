name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_macos:
        description: Run the optional macOS validation job.
        required: false
        default: false
        type: boolean
      run_docker:
        description: Run the optional Docker image build job.
        required: false
        default: false
        type: boolean
      run_e2e:
        description: Run the optional Docker end-to-end job.
        required: false
        default: false
        type: boolean
      run_webui_smoke:
        description: Run the optional WebUI browser smoke tests.
        required: false
        default: false
        type: boolean
      run_webui_demo:
        description: Run the optional static WebUI demo checks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_ci: >-
        ${{
          !(github.event_name == 'workflow_dispatch') &&
          (
            (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
            (github.event_name == 'push' && (
              startsWith(github.event.head_commit.message, 'docs:') ||
              startsWith(github.event.head_commit.message, 'docs(') ||
              startsWith(github.event.head_commit.message, 'docs!:') ||
              startsWith(github.event.head_commit.message, 'chore:') ||
              startsWith(github.event.head_commit.message, 'chore(') ||
              startsWith(github.event.head_commit.message, 'chore!:')
            ))
          )
        }}
      docker: ${{ steps.filter.outputs.docker }}
      python_versions: ${{ steps.filter.outputs.python_versions }}
      docker_e2e: ${{ steps.filter.outputs.docker_e2e }}
      webui_smoke: ${{ steps.filter.outputs.webui_smoke }}
      webui_demo: ${{ steps.filter.outputs.webui_demo }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - '.github/workflows/release.yml'
              - '.github/workflows/release-validation.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'requirements-build.txt'
              - 'src/wudup/**'
              - 'docs/examples/docker-compose*.yml'
              - 'bin/*'
              - 'wud/*'
              - 'webui/**'
              - 'tests/container-build.sh'
              - 'tests/smoke-container-image.sh'
              - 'tests/e2e-docker-compose.sh'
              - 'tests/test-entrypoint.sh'
            docker_e2e:
              - '.github/workflows/release-validation.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'requirements-build.txt'
              - 'bin/*'
              - 'wud/*'
              - 'src/wudup/*'
              - 'src/wud_updater/*'
              - 'tests/e2e-docker-compose.sh'
            python_versions:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-python-env/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'requirements-build.txt'
              - 'requirements-dev.txt'
              - 'src/**'
              - 'tests/**'
              - 'bin/**'
              - 'scripts/**'
              - 'wud/**'
              - 'webui/scripts/**'
              - 'docs/examples/**'
              - 'maintainability-policy.json'
            webui_smoke:
              - 'webui/**'
              - '.github/actions/setup-node-env/**'
            webui_demo:
              - 'webui/**'
              - '.github/actions/setup-node-env/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/webui-demo-pages.yml'
            workflows:
              - '.github/actions/**'
              - '.github/workflows/*'

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: tests/run-all.sh --python

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python

  python-versions:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.python_versions == 'true'
        )
      }}
    strategy:
      fail-fast: false
      matrix:
        # python tests covers 3.14; these install the same hashed locks.
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m pytest

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Run tests
        run: tests/run-all.sh --shell

  maintainability:
    name: maintainability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A `[skip ci]` title must not skip the size gate, so this job ignores skip_ci.
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the checker from the PR's merge base, so a PR cannot change the
      # checker that judges it. The policy is read from the PR head, where
      # every ceiling change is visible in the diff.
      - name: Check file growth against the maintainability policy
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          checker="$RUNNER_TEMP/check_maintainability.py"
          git show "$base:scripts/check_maintainability.py" > "$checker"
          status=0
          python3 "$checker" --repo . --base "$base" --head "$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/maintainability.json" || status=$?
          python3 - "$RUNNER_TEMP/maintainability.json" <<'EOF'
          import json, os, sys
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              try:
                  with open(sys.argv[1]) as source:
                      report = json.load(source)
              except ValueError:
                  summary.write("The maintainability checker did not produce a report; see the job log.\n")
                  sys.exit(0)
              summary.write(f"## Maintainability: {report['result']}\n\n")
              for reason in report["blocked"]:
                  summary.write(f"- {reason}\n")
              for row in report["files"]:
                  for failure in row["failures"]:
                      print(f"::error file={row['path']}::{failure}")
                      summary.write(
                          f"- `{row['path']}` ({row['base_lines']} -> {row['head_lines']} lines,"
                          f" ceiling {row['ceiling']}): {failure}\n"
                      )
                  # A merge-base checker older than this job warned for every large file; show only changed ones.
                  if row["status"] != "unchanged":
                      for warning in row["warnings"]:
                          print(f"::warning file={row['path']}::{warning}")
              if report["result"] == "FAIL":
                  summary.write(f"\n{report['remediation']}\n")
          EOF
          exit "$status"

  webui-checks:
    name: webui checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env
        with:
          install-dependencies: "false"

      - name: Run tests
        run: tests/run-all.sh --webui

      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: webui

  webui-smoke:
    name: webui smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_smoke) ||
          needs.changes.outputs.webui_smoke == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Install Chromium
        run: npm --prefix webui run playwright:install

      - name: Run WebUI smoke tests
        run: npm --prefix webui run test:smoke

  webui-demo:
    name: webui demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_demo) ||
          needs.changes.outputs.webui_demo == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build static WebUI demo
        run: npm --prefix webui run build:demo

      - name: Install Chromium
        run: npm --prefix webui run playwright:install

      - name: Run static WebUI demo smoke tests
        run: npm --prefix webui run test:smoke:demo

  macos-tests:
    name: macos tests
    runs-on: macos-latest
    timeout-minutes: 20
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_macos) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: tests/run-all.sh

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          (
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--') ||
            contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          )
        ) ||
        (
          needs.changes.outputs.skip_ci != 'true' &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.run_docker) ||
            (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')) ||
            needs.changes.outputs.docker == 'true'
          )
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run container build test
        run: tests/container-build.sh

  docker-e2e:
    name: docker e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e')) ||
          needs.changes.outputs.docker_e2e == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker end-to-end test
        run: tests/e2e-docker-compose.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.workflows == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color
