name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_macos:
        description: Run the optional macOS validation job.
        required: false
        default: false
        type: boolean
      run_docker:
        description: Run the optional Docker image build job.
        required: false
        default: false
        type: boolean
      run_e2e:
        description: Run the optional Docker end-to-end job.
        required: false
        default: false
        type: boolean
      run_webui_smoke:
        description: Run the optional WebUI browser smoke tests.
        required: false
        default: false
        type: boolean
      run_webui_demo:
        description: Run the optional static WebUI demo checks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_ci: >-
        ${{
          !(github.event_name == 'workflow_dispatch') &&
          (
            (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[skip ci]')) ||
            (github.event_name == 'push' && (
              startsWith(github.event.head_commit.message, 'docs:') ||
              startsWith(github.event.head_commit.message, 'docs(') ||
              startsWith(github.event.head_commit.message, 'docs!:') ||
              startsWith(github.event.head_commit.message, 'chore:') ||
              startsWith(github.event.head_commit.message, 'chore(') ||
              startsWith(github.event.head_commit.message, 'chore!:')
            ))
          )
        }}
      docker: ${{ steps.filter.outputs.docker }}
      docker_e2e: ${{ steps.filter.outputs.docker_e2e }}
      webui_smoke: ${{ steps.filter.outputs.webui_smoke }}
      webui_demo: ${{ steps.filter.outputs.webui_demo }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant path changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - '.github/workflows/release.yml'
              - '.github/workflows/release-validation.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'requirements.txt'
              - 'docs/examples/docker-compose*.yml'
              - 'bin/*'
              - 'wud/*'
              - 'webui/**'
              - 'tests/container-build.sh'
              - 'tests/smoke-container-image.sh'
              - 'tests/e2e-docker-compose.sh'
              - 'tests/test-entrypoint.sh'
            docker_e2e:
              - '.github/workflows/release-validation.yml'
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'bin/*'
              - 'wud/*'
              - 'src/wudup/*'
              - 'src/wud_updater/*'
              - 'tests/e2e-docker-compose.sh'
            webui_smoke:
              - 'webui/**'
              - '.github/actions/setup-node-env/**'
            webui_demo:
              - 'webui/**'
              - '.github/actions/setup-node-env/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/webui-demo-pages.yml'
            workflows:
              - '.github/actions/**'
              - '.github/workflows/*'

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: tests/run-all.sh --python

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Run tests
        run: tests/run-all.sh --shell

  webui-checks:
    name: webui checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: ${{ needs.changes.outputs.skip_ci != 'true' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env
        with:
          install-dependencies: "false"

      - name: Run tests
        run: tests/run-all.sh --webui

      - name: Upload results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: webui

  webui-smoke:
    name: webui smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_smoke) ||
          needs.changes.outputs.webui_smoke == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Install Chromium
        run: npm --prefix webui run playwright:install

      - name: Run WebUI smoke tests
        run: npm --prefix webui run test:smoke

  webui-demo:
    name: webui demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_webui_demo) ||
          needs.changes.outputs.webui_demo == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build static WebUI demo
        run: npm --prefix webui run build:demo

      - name: Install Chromium
        run: npm --prefix webui run playwright:install

      - name: Run static WebUI demo smoke tests
        run: npm --prefix webui run test:smoke:demo

  macos-tests:
    name: macos tests
    runs-on: macos-latest
    timeout-minutes: 20
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_macos) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Set up Python environment
        uses: ./.github/actions/setup-python-env

      - name: Run tests
        run: tests/run-all.sh

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_docker) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')) ||
          needs.changes.outputs.docker == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run container build test
        run: tests/container-build.sh

  docker-e2e:
    name: docker e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.run_e2e) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e')) ||
          needs.changes.outputs.docker_e2e == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Docker end-to-end test
        run: tests/e2e-docker-compose.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: >-
      ${{
        needs.changes.outputs.skip_ci != 'true' &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.workflows == 'true'
        )
      }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color
