version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      pydantic-runtime:
        dependency-type: "production"
        patterns:
          - "pydantic"
      python-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      python-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    ignore:
      # pydantic pins an exact pydantic-core, so standalone core PRs cannot
      # merge. Dependabot does not refresh core in pydantic PRs either (#646,
      # #894): run `make lock` on each pydantic PR before merging.
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-tooling-majors:
        dependency-type: "development"
        update-types:
          - "major"
        patterns:
          - "vite"
          - "@vitejs/plugin-vue"
          - "vitest"
          - "vue-tsc"
          - "typescript"
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
