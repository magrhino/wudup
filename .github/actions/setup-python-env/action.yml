name: setup-python-env
description: "Set up Python and install development dependencies in a virtual environment"
inputs:
  python-version:
    description: "Python version to install the hashed locks into"
    required: false
    # Match the interpreter used to generate the CI lock.
    default: "3.14"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-build.txt
          requirements-dev.txt

    - name: Install Python dev dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m venv .venv
        . .venv/bin/activate
        pip_log="$RUNNER_TEMP/pip-install.log"
        if ! python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt -r requirements-build.txt 2>&1 | tee "$pip_log"; then
          # Only a resolver conflict means the locks disagree; network or index errors need a rerun instead.
          if grep -q 'ResolutionImpossible' "$pip_log"; then
            echo "::error title=Python lock files are out of sync::pip found conflicting pins in the requirements files, for example pydantic was bumped without pydantic-core. Run 'make lock' on this branch, commit the regenerated requirements files, and push."
          fi
          exit 1
        fi
        # Local editable source still builds; binary-only applies to index candidates.
        python -m pip install --only-binary=:all: --no-deps --no-build-isolation -e '.[dev]'
        python -m pip check
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
