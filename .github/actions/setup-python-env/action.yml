name: setup-python-env
description: "Set up Python and install development dependencies in a virtual environment"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        # Match the interpreter used to generate the CI lock.
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-build.txt
          requirements-dev.txt

    - name: Install Python dev dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m venv .venv
        . .venv/bin/activate
        python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
        # Local editable source still builds; binary-only applies to index candidates.
        python -m pip install --only-binary=:all: --no-deps --no-build-isolation -e '.[dev]'
        python -m pip check
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
