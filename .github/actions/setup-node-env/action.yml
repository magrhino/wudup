name: setup-node-env
description: "Set up Node.js and install WebUI frontend dependencies"
inputs:
  install-dependencies:
    description: "Install WebUI frontend dependencies"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: webui/package-lock.json

    - name: Install frontend dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: npm --prefix webui ci --ignore-scripts
