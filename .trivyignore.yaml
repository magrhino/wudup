# Time-boxed exceptions for the edge, release, and scheduled image scans.
# Policy: SECURITY.md#release-image-policy. Checked by scripts/check_trivyignore.py.
#
# Each entry needs:
#   id:         the CVE-... or GHSA-... identifier
#   statement:  why it is safe to ship meanwhile and what fixes it
#   expired_at: unquoted date at most 90 days ahead; Trivy stops applying the
#               entry at 00:00 UTC that day, so a finding that is still
#               unpatched fails the daily scheduled scan and blocks publishing
# Optional, to narrow the entry: paths (image file paths from the scan output).
#
# Ignored findings still appear in every scan log. Remove an entry once fixed.
vulnerabilities:
  - id: CVE-2026-78667
    paths:
      - usr/local/libexec/docker/cli-plugins/docker-compose
    statement: >-
      Denial of service only. Fixed in Go 1.26.9 and golang.org/x/net 0.60.0,
      but docker-compose 5.6.0, the latest release and the one bundled by
      docker:29.9.0-cli, is still built with Go 1.26.8 and x/net 0.58.0.
      Remove once the docker CLI image ships a compose built with the fixes.
    expired_at: 2026-11-08
