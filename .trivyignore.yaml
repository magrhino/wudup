# Time-boxed exceptions for the edge, release, and scheduled image scans.
# Policy: SECURITY.md#release-image-policy. Checked by scripts/check_trivyignore.py.
#
# Each entry needs:
#   id:         the CVE-... or GHSA-... identifier
#   statement:  why it is safe to ship meanwhile and what fixes it
#   expired_at: unquoted date at most 90 days ahead; Trivy stops applying the
#               entry at 00:00 UTC that day, so a finding that is still
#               unpatched fails the next scheduled scan and blocks publishing
# Optional, to narrow the entry: paths (image file paths from the scan output).
#
# Ignored findings still appear in every scan log. Remove an entry once fixed.
vulnerabilities:
  - id: CVE-2026-78669
    paths:
      - usr/local/libexec/docker/cli-plugins/docker-compose
    statement: >-
      Denial of service only. Fixed in golang.org/x/net 0.60.0, but the latest
      upstream release is still vulnerable: docker-compose 5.6.1, bundled by
      docker:29.9.2-cli, is built with Go 1.26.10 but still x/net 0.58.0.
      Remove once the docker CLI image ships a compose build with the fix.
    expired_at: 2026-11-08
  - id: CVE-2026-116587
    paths:
      - usr/local/bin/trivy
    statement: >-
      Denial of service only, when Trivy parses JWKs that contain RSA keys.
      Fixed in go-jose 4.1.6 on Trivy main, but the latest release,
      aquasec/trivy:0.76.1, still bundles go-jose 4.1.5. Remove once a Trivy
      release ships the fix and the Dockerfile bumps to it.
    expired_at: 2026-11-28
