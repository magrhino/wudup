[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wudup"
version = "0.59.6"
description = "Reviewable Docker Compose updates powered by What's Up Docker."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "pydantic==2.13.5",
    "rich>=13.7,<16",
    "ruamel.yaml>=0.18.13,<0.20",
    "tzdata>=2024.1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<8",
    "pytest-xdist>=3.5,<4",
    "ruff==0.16.5",
    "pip-tools>=7.4,<8",
]

[project.scripts]
wudup = "wudup.cli:main"
wud-updater = "wudup.cli:main"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F"]
# Preserve deliberate string assembly (FLY002) and explicit nested scopes (SIM117).
ignore = ["FLY002", "SIM117"]
typing-extensions = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"src/wudup/db.py" = ["PLC0414"]
"src/wudup/updater_lifecycle.py" = ["PLC0414"]
"src/wudup/updater_planning.py" = ["PLC0414"]
"src/wudup/web_wud_api.py" = ["PLC0414"]
"src/wud_updater/__init__.py" = ["PLE0605"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_python_*.py"]
pythonpath = ["src"]
addopts = "-n auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wudup = [
    "ascii-text-art.txt",
    "discord_webhook_policy.json",
    "web_static/index.html",
    "web_static/assets/*",
]
